    <meta charset="UTF-8">

    <meta property="og:title" content="Conflict Roleplay | Server Stats">
    <meta property="og:description" content="Serious GTA 5 Roleplay | Realistic | Immersive | Community-Driven">
    <meta property="og:image" content="images/favicon.png">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <meta name="theme-color" content="#ff2a2a">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="images/image.png" fetchpriority="high">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet"></noscript>

<body class="inner-page no-scroll-page">
<nav class="navbar">
    <div class="nav-logo"><a href="/index.html">Conflict RP</a></div>

    <ul class="nav-links" id="nav-links">
        <li><a href="/index.html#about">Home</a></li>
        <li><a href="/features.html">Features</a></li>
        <li><a href="/departments.html">Departments</a></li>
        <li class="active-link"><a href="/ServerStats.html">ServerStats</a></li>
    </ul>


    

    <div class="hamburger" id="hamburger">
        ☰
    </div>
</nav>

<section id="join" class="join-section">

    <div class="join-panel">
        <div class="server-ip">
            <span class="join-label">Server IP</span>
            <span id="ip-text">play.conflictrp.com</span>
            <button type="button" class="copy-btn">Copy</button>
        </div>
        <div class="join-meta">
            <div class="server-status">
                <span class="status-indicator" id="status-dot"></span>
                <span id="server-status-text">
                    Checking server...
                </span>
                <button id="refresh-btn" class="refresh-btn" type="button" title="Refresh server status">Refresh</button>
            </div>

            <div class="player-count">
                Players Online: <span id="player-count">0</span> / <span id="max-players">0</span>
            </div>
        </div>
    </div>
</section>

<section id="stats">
    
    <div class="stats">
        <div class="stat">
            <h2 class="counter" data-target="100">0</h2>
            <p>Discord Members</p>
        </div>
        <div class="stat">
            <h2 class="counter" data-target="99">0</h2>
            <p>Server Uptime %</p>
        </div>
        <div class="stat">
            <h2 class="counter" data-target="30">0</h2>
            <p>Peak Concurrent Players</p>
        </div>
        <div class="stat">
            <h2 class="counter" data-target="50">0</h2>
            <p>Custom Assets</p>
        </div>
    </div>
</section>

</footer>

</body>
</html>
